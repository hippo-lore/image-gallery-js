<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Галерея випадкових картинок</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Галерея випадкових картинок</h1>

    <div class="gallery" id="gallery"></div>

    <div class="buttons">
        <button id="loadMore">Завантажити ще 4 картинки</button>
        <button id="clearGallery">Очистити галерею</button>
        <button id="removeLast">Видалити останню картинку</button>
        <button id="reverseGallery">Перевернути галерею</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
